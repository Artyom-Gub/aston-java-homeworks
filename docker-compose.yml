version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=userdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pass
    ports:
      - "8080:8080"
    networks:
      - microservices-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    networks:
      - microservices-net

  service-registry:
    build: ./service-registry
    ports:
      - "8082:8082"
    networks:
      - microservices-net

  api-gateway:
    build: ./api-gateway
    ports:
      - "8090:8090"
    networks:
      - microservices-net

  user-service:
    build: ./user-service
    networks:
      - microservices-net

  notification-service:
    build: ./notification-service
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge